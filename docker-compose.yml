services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    expose:
      - "5000"
    environment:
      # Browsers drop a Secure cookie over plain HTTP. Phase 1 item 9 adds HTTPS and removes this.
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: ./media
        target: /app/apps/api/media
      # A named volume, so that the database stays on local disk even if ./media is on a NAS.
      - sqlite-data:/data
    networks:
      - show_stream_network
  # Runs ffmpeg jobs. It publishes no ports, and reaches the API only through the database.
  worker:
    container_name: worker
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
    volumes:
      - type: bind
        source: ./media
        target: /media
      - sqlite-data:/data
    networks:
      - show_stream_network
  next-client:
    container_name: next-client
    build:
      context: .
      dockerfile: ./apps/next-client/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    networks:
      - show_stream_network

volumes:
  sqlite-data:

networks:
  show_stream_network:
    external: true