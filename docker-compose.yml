services:
  # The only published service. Its data volume holds the certificates and the internal CA.
  caddy:
    image: caddy:2.11.7-alpine
    restart: always
    depends_on:
      - api
      - next-client
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    expose:
      - "5000"
    volumes:
      - type: bind
        source: ./media
        target: /app/apps/api/media
      # A named volume, so that the database stays on local disk even if ./media is on a NAS.
      - sqlite-data:/data
  # Runs ffmpeg, scan and backup jobs. It publishes no ports, and reaches the API only through
  # the database.
  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    restart: always
    depends_on:
      - api
    # Library scans need the TMDB token from this file. It stays out of the worker's image.
    env_file:
      - path: ./apps/api/.env
        required: false
    # These win over that file, whose paths are for pnpm dev.
    environment:
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      DATABASE_PATH: /data/app.db
      MEDIA_FOLDER: /media
      BACKUP_FOLDER: /backups
    volumes:
      - type: bind
        source: ./media
        target: /media
      - type: bind
        source: ./backups
        target: /backups
      - sqlite-data:/data
  next-client:
    build:
      context: .
      dockerfile: ./apps/next-client/Dockerfile
    restart: always
    expose:
      - "3000"

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:
