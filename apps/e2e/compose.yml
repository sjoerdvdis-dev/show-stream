# The whole system with fake secrets and throwaway data. Start it with `pnpm test:browser`,
# which sets E2E_CONTEXT and E2E_USER and removes everything afterwards.
#
# Nothing is published to the host, and ./media is not mounted: the database and media
# live in volumes that the run removes.
name: show-stream-browser-tests

x-api-build: &api-build
  context: ${E2E_CONTEXT:?Run this with pnpm test:browser}
  dockerfile: apps/api/Dockerfile

services:
  api:
    build: *api-build
    environment:
      JWT_SECRET: fake-secret-for-browser-tests
      JWT_EXPIRES_IN: "3600"
      TMDB_API_READ_ACCESS_TOKEN: fake-token-for-browser-tests
    volumes:
      - sqlite-data:/data
      - /app/apps/api/media
      - type: bind
        source: ./fixtures/clip.mp4
        target: /app/apps/api/media/movies/Demo Movie (2024)/clip.mp4
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/movies"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs once the API has migrated the new volume, from the API image so that it can load
  # packages/db.
  seed:
    build: *api-build
    depends_on:
      api:
        condition: service_healthy
    working_dir: /app/apps/api
    volumes:
      - sqlite-data:/data
      - ./fixtures/seed.mjs:/app/apps/api/seed.mjs:ro
    command: ["node", "seed.mjs"]

  next-client:
    build:
      context: ${E2E_CONTEXT:?Run this with pnpm test:browser}
      dockerfile: apps/next-client/Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Keep this tag equal to @playwright/test in package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      next-client:
        condition: service_healthy
    user: ${E2E_USER:?Run this with pnpm test:browser}
    environment:
      HOME: /tmp
    working_dir: /repo/apps/e2e
    volumes:
      - ../..:/repo:ro
      - ./test-results:/repo/apps/e2e/test-results
    command: ["./node_modules/.bin/playwright", "test"]

volumes:
  sqlite-data:
