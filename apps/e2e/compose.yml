# The whole system with fake secrets and throwaway data. Start it with `pnpm test:browser`,
# which sets E2E_CONTEXT and E2E_USER and removes everything afterwards.
#
# Nothing is published to the host, and ./media is not mounted: the database and media
# live in volumes that the run removes.
name: show-stream-browser-tests

x-api-build: &api-build
  context: ${E2E_CONTEXT:?Run this with pnpm test:browser}
  dockerfile: apps/api/Dockerfile

services:
  api:
    build: *api-build
    volumes:
      - sqlite-data:/data
      - media:/app/apps/api/media
      - type: bind
        source: ./fixtures/clip.mp4
        target: /app/apps/api/media/movies/Demo Movie (2024)/clip.mp4
        read_only: true
      - type: bind
        source: ./fixtures/corrupt.mp4
        target: /app/apps/api/media/movies/Corrupt Movie (2024)/corrupt.mp4
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/auth/setup"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ${E2E_CONTEXT:?Run this with pnpm test:browser}
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      TMDB_API_READ_ACCESS_TOKEN: fake-token-for-browser-tests
      NODE_OPTIONS: --import=/fixtures/fake-tmdb.mjs
    volumes:
      - sqlite-data:/data
      - media:/media
      - backups:/backups
      - ./fixtures/fake-tmdb.mjs:/fixtures/fake-tmdb.mjs:ro
      - type: bind
        source: ./fixtures/clip.mp4
        target: /media/movies/Demo Movie (2024)/clip.mp4
        read_only: true
      - type: bind
        source: ./fixtures/corrupt.mp4
        target: /media/movies/Corrupt Movie (2024)/corrupt.mp4
        read_only: true
      # Folders only a scan finds. The seed adds neither.
      - type: bind
        source: ./fixtures/clip.mp4
        target: /media/movies/Scanned Movie (2024)/clip.mp4
        read_only: true
      - type: bind
        source: ./fixtures/clip.mp4
        target: /media/movies/Unknown Film (2024)/clip.mp4
        read_only: true
    # The same check as docker-compose.yml.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs once the API has migrated the new volume, from the API image so that it can load
  # packages/db.
  seed:
    build: *api-build
    depends_on:
      api:
        condition: service_healthy
    working_dir: /app/apps/api
    volumes:
      - sqlite-data:/data
      - ./fixtures/seed.mjs:/app/apps/api/seed.mjs:ro
    command: ["node", "seed.mjs"]

  # The image that ships, with apps/web and the Caddyfile inside it, in its default mode, under the
  # name the tests address. It waits for the seed and the worker too, so that the first test finds
  # the library ready.
  caddy:
    build:
      context: ${E2E_CONTEXT:?Run this with pnpm test:browser}
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    environment:
      SITE_ADDRESS: caddy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Keep this tag equal to @playwright/test in package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      caddy:
        condition: service_healthy
    user: ${E2E_USER:?Run this with pnpm test:browser}
    environment:
      HOME: /tmp
    working_dir: /repo/apps/e2e
    volumes:
      - ../..:/repo:ro
      - ./test-results:/repo/apps/e2e/test-results
    command: ["./node_modules/.bin/playwright", "test"]

volumes:
  sqlite-data:
  media:
  backups:
