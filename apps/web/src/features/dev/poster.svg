	<path d="M0 420 L90 360 L170 400 L260 330 L400 410 L400 600 L0 600 Z" fill="#2c1a3a" />
	<path d="M0 480 L120 430 L230 470 L330 440 L400 460 L400 600 L0 600 Z" fill="#130c1c" />
