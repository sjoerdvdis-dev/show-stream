			<stop offset="0" stop-color="#fdfbf3" />
			<stop offset="0.45" stop-color="#ffd98a" />
			<stop offset="0.75" stop-color="#f08a4b" />
			<stop offset="1" stop-color="#5b2a4e" />
		</linearGradient>
	</defs>
	<rect width="400" height="600" fill="url(#sky)" />
