name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check. Keep it small; tests join it as they arrive.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API tests run real ffmpeg jobs, and fail rather than skip without it in CI.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm turbo check-types lint build test --ui=stream

  # Reports advisories. Not a required check, so it cannot block a merge.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit

  # Reports the Chromium flow. Not a required check, so it cannot block a merge.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: apps/e2e/test-results
